console:
  window:
    width: 1280
    height: 720
    fullscreen: false
    resizable: false
    decorated: false
  commands:
    restart_service:
      - /usr/bin/sudo /usr/bin/systemctl restart pipedald.service
    restart_console:
      - /usr/bin/pkill labwc
    poweroff:
      - /usr/bin/sudo /usr/sbin/poweroff
    reboot:
      - /usr/bin/sudo /usr/sbin/reboot
  alsa:
    device: Zero
    input:
      - mixername: ADC
      - mixername: Aux
        displayname: IN
        channels: 2
    output:
      - mixername: Headphone
        displayname: OUT
        channels: 2
      - mixername: DAC
  buttons:
    - label: PiPedal
      commands:
        - /usr/bin/chromium --app=http://localhost
      fork: true
      geometry:
        column: 0
        row: 0
        width: 1
        height: 2
    - label: Shell
      commands:
        - /usr/bin/lxterminal --geometry=125x35
      fork: true
      geometry:
        column: 1
        row: 0
        width: 1
        height: 2
  clock:
    enable: true
    show_seconds: false

midibridge:
  - remote_type: websocket
    url: ws://rpi5-1/pipedal
    command_fmt: '[{"message":"loadPluginPreset"},{"pluginInstanceId":%d,"presetInstanceId":%d}]'
    presets:
      - channel: 10
        cc: 100
        cc_value: 0
        params:
          - 2
          - 7
      - channel: 10
        cc: 100
        cc_value: 1
        params:
          - 2
          - 9
      - channel: 10
        cc: 100
        cc_value: 2
        params:
          - 2
          - 1
      - channel: 10
        cc: 100
        cc_value: 3
        params:
          - 2
          - 3
      - channel: 10
        cc: 100
        cc_value: 4
        params:
          - 2
          - 5

  - remote_type: http
    url: http://rpi5-1
    command_fmt: "/func?foo=%s&bar=%s"
    presets:
      - channel: 10
        pc: 56
        params:
          - 3
          - 5
      - channel: 10
        pc: 32
        params:
          - 32
          - 51